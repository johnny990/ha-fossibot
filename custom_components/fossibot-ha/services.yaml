set_charge_schedule:
  name: Set charge schedule
  description: >-
    Write one custom AC charge window of a protocol V1 station (F7200), as the
    app's "send to device" does. Give either an energy amount or a target SoC.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: fossibot
    window:
      name: Window
      description: Schedule slot 1-3.
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 3
    start_time:
      name: Start time
      description: Minutes in steps of 10.
      required: true
      selector:
        time:
    end_time:
      name: End time
      description: Minutes in steps of 10.
      required: true
      selector:
        time:
    energy_kwh:
      name: Charge amount
      description: kWh to charge, 0 when a target SoC is given.
      selector:
        number:
          min: 0
          max: 25.5
          step: 0.1
          unit_of_measurement: kWh
    target_soc:
      name: Charge to
      description: Target SoC in %, 0 when an energy amount is given.
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    repeat:
      name: Repeat
      description: daily, or one or more weekdays.
      default: [daily]
      selector:
        select:
          multiple: true
          options: [daily, sun, mon, tue, wed, thu, fri, sat]
    enabled:
      name: Enabled
      description: Also switch the window on or off.
      selector:
        boolean:
